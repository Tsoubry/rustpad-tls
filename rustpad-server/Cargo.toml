[package]
name = "rustpad-server"
version = "0.2.0"
authors = ["Eric Zhang <ekzhang1@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0"
bytecount = "0.6"
dashmap = "6.1"
dotenv = "0.15.0"
futures = "0.3"
log = "0.4"
operational-transform = { version = "0.6.1", features = ["serde"] }
parking_lot = "0.12"
pretty_env_logger = "0.5"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1.48", features = ["full", "test-util"] }
tokio-stream = "0.1"
warp = { version = "0.3.7", features = ["tls"] }

[dev-dependencies]
tempfile = "3.23"
